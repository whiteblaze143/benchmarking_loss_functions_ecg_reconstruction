project:
  type: book
  output-dir: _book
  resources:
    - .nojekyll

book:
  title: "Benchmarking Loss Functions for Electrocardiogram Reconstruction"
  subtitle: "A Clinical & Methodological Handbook"
  author: "Antigravity Research Team"
  date: "August 29, 2026"
  page-navigation: true
  search: true
  sidebar:
    style: docked
    collapse-level: 2
  chapters:
    - index.qmd
    - part: "Live Experiment Observatory"
      chapters:
        - 15_live_results_observatory.qmd
        - 16_three_lead_ecgaim_live.qmd
        - 17_one_lead_wavelet_ssl_live.qmd
    - part: "Completed One-Lead ECG-AIM Evidence"
      chapters:
        - 24_one_lead_completed_screening_results.qmd
        - 27_one_lead_completed_spatial_results.qmd
        - 25_one_lead_convergence_results.qmd
        - 26_one_lead_rdb_external_results.qmd
    - part: "Completed Three-Lead and Delineation Evidence"
      chapters:
        - 28_three_lead_completed_external_results.qmd
        - 29_completed_ecgaim_representation_results.qmd
        - 30_completed_ludb_semiseg_results.qmd
        - 31_deep_evidence_visual_dashboard.qmd
    - part: "Expanded and Partial Evidence"
      chapters:
        - 18_seven_mask_design_and_coverage.qmd
        - 19_seven_mask_reconstruction_results.qmd
        - 20_missing_leads_v2_clinical_biomarkers.qmd
        - 21_one_lead_architecture_and_spatial_results.qmd
        - 22_one_lead_wavelet_ssl_mechanisms.qmd
        - 23_evidence_synthesis_and_run_gaps.qmd
    - part: "I. Data, Cohorts, and Measurement"
      chapters:
        - 09_real_data_eda_and_diagnostics.qmd
        - 11_dataset_atlas_ludb_isp_sunnybrook.qmd
        - 05_zhejiang_delineation_tutorial.qmd
        - 01_dataset_and_preprocessing.qmd
    - part: "II. Reconstruction Models and Objectives"
      chapters:
        - 02_network_architectures.qmd
        - 03_loss_function_formulations.qmd
    - part: "III. Clinical and Statistical Evaluation"
      chapters:
        - 05_clinical_metrics_and_delineation.qmd
        - 04_regression_to_mean.qmd
        - 06_fairness_robustness_sqi.qmd
    - part: "IV. Benchmark and External Validation"
      chapters:
        - 08_factorial_loss_matrix_benchmarks.qmd
        - 07_smartwatch_reconstruction_case_study.qmd
        - 10_echonext_classifier_external_validation.qmd
        - 12_exhaustive_model_analysis.qmd
    - part: "V. Visual and Clinical Atlases"
      chapters:
        - 13_engineering_ml_visual_atlas.qmd
        - 14_cath_lab_clinical_trust_atlas.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: show
    code-tools: true
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    reader-mode: true
    # Keep shared site assets external. Embedding Plotly and every dependency in
    # every chapter produced >250 MB pages and exhausted memory on full renders.
    embed-resources: false
    # KaTeX assets are emitted into site_libs, avoiding external MathJax and
    # polyfill runtime dependencies in the deployable snapshot.
    html-math-method: katex
    fig-width: 9
    fig-height: 6
    fig-responsive: true

execute:
  echo: true
  eval: true
  warning: false
  message: false
  cache: false
  freeze: false

# The render wrapper sets QUARTO_PYTHON; avoid a machine-local kernelspec.
jupyter: python3
