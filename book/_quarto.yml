project:
  type: book
  output-dir: _book

book:
  title: "Benchmarking Loss Functions for Electrocardiogram Reconstruction"
  subtitle: "A Clinical & Methodological Handbook"
  author: "Antigravity Research Team"
  date: "July 31, 2026"
  page-navigation: true
  search: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "I. Data, Cohorts, and Measurement"
      chapters:
        - 09_real_data_eda_and_diagnostics.qmd
        - 11_dataset_atlas_ludb_isp_sunnybrook.qmd
        - 05_zhejiang_delineation_tutorial.qmd
        - 01_dataset_and_preprocessing.qmd
    - part: "II. Reconstruction Models and Objectives"
      chapters:
        - 02_network_architectures.qmd
        - 03_loss_function_formulations.qmd
    - part: "III. Clinical and Statistical Evaluation"
      chapters:
        - 05_clinical_metrics_and_delineation.qmd
        - 04_regression_to_mean.qmd
        - 06_fairness_robustness_sqi.qmd
    - part: "IV. Benchmark and External Validation"
      chapters:
        - 08_factorial_loss_matrix_benchmarks.qmd
        - 07_smartwatch_reconstruction_case_study.qmd
        - 10_echonext_classifier_external_validation.qmd
        - 12_exhaustive_model_analysis.qmd
    - part: "V. Visual and Clinical Atlases"
      chapters:
        - 13_engineering_ml_visual_atlas.qmd
        - 14_cath_lab_clinical_trust_atlas.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: show
    code-tools: true
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    reader-mode: true
    # Keep shared site assets external. Embedding Plotly and every dependency in
    # every chapter produced >250 MB pages and exhausted memory on full renders.
    embed-resources: false
    html-math-method: mathjax
    fig-width: 9
    fig-height: 6
    fig-responsive: true

execute:
  echo: true
  eval: true
  warning: false
  message: false
  cache: false
  freeze: false

jupyter: venv-kernel
