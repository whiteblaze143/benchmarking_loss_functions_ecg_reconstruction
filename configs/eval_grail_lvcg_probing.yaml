# Evaluation config for GRAIL-ECG representations using the LVCG downstream linear probing pipeline.
models:
  grail:
    type: grail
    source: grail_v2_full_111
    checkpoint: checkpoints/grail_v2/model_m_best.pt
    use_geometry: true
    use_slots: true
    use_view_aux: true
  lvcg:
    type: grail
    source: grail_v2_full_111
    checkpoint: checkpoints/grail_v2/model_m_best.pt
    use_geometry: true
    use_slots: true
    use_view_aux: true

datasets:
  - ptbxl_super_class
  - ptbxl_sub_class
  - ptbxl_form
  - ptbxl_rhythm

label_ratios: [0.1, 1.0]
seeds: [42]

data:
  raw_root: data
  splits_root: external/LVCG/probing/data_splits
  norm_method: zscore

probe:
  # A100-40GB witness: batch 2048 uses 25.2 GiB and processes 337 ECG/s.
  batch_size: 2048
  lr: 0.001
  max_epochs: 20
  patience: 3
  num_workers: 2
  freeze_backbone: true

device: cuda
