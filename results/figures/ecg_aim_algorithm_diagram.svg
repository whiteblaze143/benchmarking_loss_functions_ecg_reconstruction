<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="1400" height="950" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="1400" height="950" fill="#ffffff"/>
  <defs>
    <marker id="arrow-default" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#555555"/>
    </marker>
    <marker id="arrow-c0" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-c1" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-c2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#10B981"/>
    </marker>
    <marker id="arrow-c3" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-c4" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#EF4444"/>
    </marker>
    <marker id="arrow-c5" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#0EA5E9"/>
    </marker>
    <marker id="arrow-c6" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#6366F1"/>
    </marker>
    <marker id="arrow-c7" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 4, 0 8" fill="#EC4899"/>
    </marker>
  </defs>
  <rect x="35.0" y="115.0" width="290.0" height="410.0" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1" rx="8"/>
  <text x="43.0" y="131.0" font-size="10" fill="#999999" font-weight="bold">Stage I: Ingestion &amp; Masking</text>
  <rect x="370.0" y="115.0" width="300.0" height="410.0" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1" rx="8"/>
  <text x="378.0" y="131.0" font-size="10" fill="#999999" font-weight="bold">Stage II: Tokenization &amp; Encoding</text>
  <rect x="715.0" y="115.0" width="310.0" height="410.0" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1" rx="8"/>
  <text x="723.0" y="131.0" font-size="10" fill="#999999" font-weight="bold">Stage III: Biophysical Grid &amp; Axial Decoding</text>
  <rect x="1065.0" y="115.0" width="290.0" height="410.0" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1" rx="8"/>
  <text x="1073.0" y="131.0" font-size="10" fill="#999999" font-weight="bold">Stage IV: Synthesis &amp; Loss Supervision</text>
  <path d="M 180.0,220.0 L 180.0,277.5" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#arrow-c0)"/>
  <path d="M 180.0,362.5 L 180.0,420.0" stroke="#DB2777" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 228.6,420.0 Q 369.1,343.2 471.4,220.0" stroke="#16A34A" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 520.0,220.0 L 520.0,280.0" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 520.0,360.0 L 520.0,420.0" stroke="#8B5CF6" stroke-width="2" fill="none" marker-end="url(#arrow-c1)"/>
  <path d="M 570.0,420.0 Q 713.7,343.4 820.0,220.0" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 870.0,220.0 L 870.0,280.0" stroke="#D97706" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 870.0,360.0 L 870.0,420.0" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 918.6,420.0 Q 1059.1,343.2 1161.4,220.0" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arrow-c3)"/>
  <path d="M 1210.0,220.0 L 1210.0,280.0" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow-c2)"/>
  <path d="M 1210.0,360.0 L 1210.0,420.0" stroke="#EF4444" stroke-width="2" fill="none" marker-end="url(#arrow-c4)"/>
  <rect x="60.0" y="140.0" width="240.0" height="80.0" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" rx="8"/>
  <text x="180.0" y="177.2" font-size="12" fill="#1E3A8A" text-anchor="middle" font-weight="bold">1. Input Initialization</text>
  <text x="180.0" y="191.2" font-size="9" fill="#888888" text-anchor="middle">Raw 12-Lead Y [B, 12, 5000]
Sparse Masking -&gt; X_masked [B, 12, 5000]</text>
  <rect x="60.0" y="277.5" width="240.0" height="85.0" fill="#FDF2F8" stroke="#DB2777" stroke-width="2" rx="8"/>
  <text x="180.0" y="317.2" font-size="12" fill="#9D174D" text-anchor="middle" font-weight="bold">2. Stochastic Dynamic Masking</text>
  <text x="180.0" y="331.2" font-size="9" fill="#888888" text-anchor="middle">Inherited Mask + Strategy ~ {Patch, Span, Lead}
-&gt; available_mask [B, 12, 200]</text>
  <rect x="60.0" y="420.0" width="240.0" height="80.0" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" rx="8"/>
  <text x="180.0" y="457.2" font-size="12" fill="#166534" text-anchor="middle" font-weight="bold">3. Unit-RMS Energy Scaling</text>
  <text x="180.0" y="471.2" font-size="9" fill="#888888" text-anchor="middle">sigma_RMS = sqrt(mean(X_obs^2)) + 1e-3
X_norm = X_masked / sigma_RMS</text>
  <rect x="395.0" y="140.0" width="250.0" height="80.0" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" rx="8"/>
  <text x="520.0" y="177.2" font-size="12" fill="#0369A1" text-anchor="middle" font-weight="bold">4. 1D Patch Tokenization</text>
  <text x="520.0" y="191.2" font-size="9" fill="#888888" text-anchor="middle">Patchify(Lp=25, P=200) -&gt; [B, 12, 200, 25]
Linear + LayerNorm -&gt; H0 [B, 12, 200, 384]</text>
  <rect x="395.0" y="280.0" width="250.0" height="80.0" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2" rx="8"/>
  <text x="520.0" y="317.2" font-size="12" fill="#4C1D95" text-anchor="middle" font-weight="bold">5. Spatiotemporal Embeddings</text>
  <text x="520.0" y="331.2" font-size="9" fill="#888888" text-anchor="middle">Z_in = H0 + E_lead + E_time + E_type[0]
Extract Visible: S = Z_in[available]</text>
  <rect x="395.0" y="420.0" width="250.0" height="80.0" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2" rx="8"/>
  <text x="520.0" y="457.2" font-size="12" fill="#5B21B6" text-anchor="middle" font-weight="bold">6. Asymmetric Encoder</text>
  <text x="520.0" y="471.2" font-size="9" fill="#888888" text-anchor="middle">Pad visible sequences to N_max &lt;= 600
Memory = TransformerEncoder(Padded, 8 L)</text>
  <rect x="740.0" y="140.0" width="260.0" height="80.0" fill="#FEF3C7" stroke="#D97706" stroke-width="2" rx="8"/>
  <text x="870.0" y="177.2" font-size="12" fill="#92400E" text-anchor="middle" font-weight="bold">7. Latent Grid Reassembly</text>
  <text x="870.0" y="191.2" font-size="9" fill="#888888" text-anchor="middle">Init Grid = [MASK] + E_lead + E_time
Insert Memory[available] -&gt; [B, 12, 200, 384]</text>
  <rect x="740.0" y="280.0" width="260.0" height="80.0" fill="#ECFDF5" stroke="#059669" stroke-width="2" rx="8"/>
  <text x="870.0" y="317.2" font-size="12" fill="#065F46" text-anchor="middle" font-weight="bold">8. Einthoven Biophysical Seeding</text>
  <text x="870.0" y="331.2" font-size="9" fill="#888888" text-anchor="middle">Compute Baseline B: III = II - I, aVR/L/F
Grid = Grid + Linear_baseline(B)</text>
  <rect x="740.0" y="420.0" width="260.0" height="80.0" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" rx="8"/>
  <text x="870.0" y="457.2" font-size="12" fill="#78350F" text-anchor="middle" font-weight="bold">9. Axial Transformer Decoding</text>
  <text x="870.0" y="471.2" font-size="9" fill="#888888" text-anchor="middle">For block = 1 to 4:
  SpatialAttn(12) -&gt; TimeAttn(200) -&gt; FFN</text>
  <rect x="1090.0" y="140.0" width="240.0" height="80.0" fill="#DCFCE7" stroke="#10B981" stroke-width="2" rx="8"/>
  <text x="1210.0" y="177.2" font-size="12" fill="#065F46" text-anchor="middle" font-weight="bold">10. Waveform Synthesis</text>
  <text x="1210.0" y="191.2" font-size="9" fill="#888888" text-anchor="middle">Residual = Linear_head(LN(Grid))
Y_pred = (B + gamma * Res) * sigma_RMS</text>
  <rect x="1090.0" y="280.0" width="240.0" height="80.0" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" rx="8"/>
  <text x="1210.0" y="317.2" font-size="12" fill="#991B1B" text-anchor="middle" font-weight="bold">11. 7-Factorial Loss Engine</text>
  <text x="1210.0" y="331.2" font-size="9" fill="#888888" text-anchor="middle">L_masked + L_cons +
Composite(MSE, Corr, Deriv, VCG, MMD)</text>
  <rect x="1090.0" y="420.0" width="240.0" height="80.0" fill="#F1F5F9" stroke="#475569" stroke-width="2" rx="8"/>
  <text x="1210.0" y="457.2" font-size="12" fill="#0F172A" text-anchor="middle" font-weight="bold">12. Optimization Step</text>
  <text x="1210.0" y="471.2" font-size="9" fill="#888888" text-anchor="middle">Scaler.backward() -&gt; Grad Clip (1.0)
AdamW Step (lr=3e-4, wd=1e-4)</text>
</svg>
